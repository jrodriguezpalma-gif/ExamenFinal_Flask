<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculo de compras</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Calculo de compras</h1>
        <form method="POST">
            <label for="nombre">Ingresa tu nombre</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="edad">Ingresa tu edad</label>
            <input type="number" id="edad" name="edad" required>

            <label for="cantidad">Ingresa la cantidad de tarros de pintura a comprar</label>
            <input type="number" id="cantidad" name="cantidad" required>

            <button type="submit">Calcular</button>
        </form>

        {% if resultado %}
        <div class="resultado">
            <p>Nombre del cliente: {{ resultado.nombre }}</p>
            <p>Total sin descuento: ${{ resultado.total_sin_descuento }}</p>
            <p>El descuento es: ${{ resultado.descuento }}</p>
            <p>El total a pagar es de: ${{ resultado.total_a_pagar }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
